  style.css: |
    :root {
      --bg: #f5f7f8;
      --surface: #ffffff;
      --text: #1c2529;
      --muted: #5f6d73;
      --line: #e1e6e8;
      --accent: #0f8b7d;
      --accent-soft: #e2f3f1;
      --warn: #b5651d;
      --warn-soft: #fbefe3;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.6;
      word-break: keep-all;
    }

    a { color: var(--accent); text-decoration: none; }
    h1, h2, h3 { line-height: 1.3; margin: 0; }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
    main.wrap { padding-top: 32px; padding-bottom: 64px; min-height: calc(100vh - 140px); }

    /* ---------- 상단 바 ---------- */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text); }
    .brand img { width: 30px; height: 30px; }
    .nav { display: flex; align-items: center; gap: 16px; font-size: 15px; }
    .nav a { color: var(--text); }
    .nav .user { color: var(--muted); }

    /* ---------- 버튼 ---------- */
    .btn {
      display: inline-block; border: 1px solid var(--accent); background: var(--accent); color: #fff;
      padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { filter: brightness(1.06); }
    .nav .btn { color: #fff; }
    .btn-ghost, .nav .btn-ghost { background: transparent; color: var(--accent); }
    .btn-sm { padding: 6px 12px; font-size: 14px; }
    .btn-lg { padding: 14px 28px; font-size: 17px; }
    .btn-block { width: 100%; }

    .flash { background: var(--accent-soft); border: 1px solid #bfe3de; padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; }
    .muted { color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }

    /* ---------- 메인 ---------- */
    .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; padding: 24px 0 48px; }
    .eyebrow { color: var(--accent); font-weight: 700; font-size: 14px; margin: 0 0 8px; letter-spacing: .02em; }
    .hero h1 { font-size: 36px; }
    .lead { color: var(--muted); font-size: 17px; margin: 16px 0 28px; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-art { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .hero-art img { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }

    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
    .step span { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .step h3 { margin: 12px 0 6px; font-size: 18px; }
    .step p { margin: 0; color: var(--muted); }

    /* ---------- 인증 ---------- */
    .auth { max-width: 400px; margin: 24px auto; }
    .auth h1 { margin-bottom: 20px; font-size: 24px; }
    .auth form { display: grid; gap: 14px; margin-bottom: 12px; }

    label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
    input[type=text], input:not([type]), input[type=password], input[type=number] {
      font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ---------- 입력 폼 ---------- */
    .page-title { font-size: 28px; margin-bottom: 20px; }
    .plan-form { display: grid; gap: 18px; }
    fieldset.card { margin: 0; }
    legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; font-weight: 700; font-size: 18px; }
    legend + * { clear: both; }
    .field-label { font-size: 14px; font-weight: 600; margin: 16px 0 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: inline-block; font-weight: 500; }
    .chip input { position: absolute; opacity: 0; pointer-events: none; }
    .chip span { display: inline-block; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: #fff; }
    .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- 결과 ---------- */
    .result-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .result-head .page-title { margin-bottom: 12px; }
    .head-actions { display: flex; gap: 8px; }
    .head-actions form { margin: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #eceff0; color: var(--muted); }
    .tag-accent { background: var(--accent-soft); color: var(--accent); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 4px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stat strong { font-size: 20px; }

    .group { margin-bottom: 32px; }
    .group h2 { font-size: 20px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .product { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
    .product.over { background: #fbfbfa; }
    .product.over img { opacity: .55; }
    .product img { width: 84px; height: 84px; flex: none; }
    .product-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .product-top { display: flex; justify-content: space-between; gap: 8px; }
    .product h3 { font-size: 16px; }
    .qty { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .desc { font-size: 14px; color: var(--muted); margin: 4px 0 8px; }
    .reasons { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .reasons span { font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; }
    .product-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
    .badge.ok { background: var(--accent-soft); color: var(--accent); }

    /* ---------- 기록 ---------- */
    .history { display: grid; gap: 10px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--text); padding: 18px 22px; }
    .history-item:hover { border-color: var(--accent); }
    .history-item h3 { font-size: 17px; margin-bottom: 2px; }
    .history-item p { margin: 0; font-size: 14px; }
    .history-meta { text-align: right; display: grid; }
    .history-meta span { font-size: 13px; color: var(--muted); }
    .empty { text-align: center; padding: 48px 24px; }

    .footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 20px 0; }

    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; }
      .hero h1 { font-size: 28px; }
      .steps { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .grid { grid-template-columns: 1fr; }
      .nav { gap: 10px; font-size: 14px; }
      .nav .user { display: none; }
    }

    @media (max-width: 420px) {
      .brand span { display: none; }
    }
    .brand, .nav a { white-space: nowrap; }
