# DB 계정과 Flask 세션 서명 키
# 과제 채점용 더미 값입니다. 실제 서비스라면 Git에 올리지 않고 oc create secret 으로 만듭니다.
apiVersion: v1
kind: Secret
metadata:
  name: smarthome-db-secret
  labels:
    app: smarthome
    app.kubernetes.io/part-of: smarthome
type: Opaque
stringData:
  database-name: smarthome
  database-user: smarthome
  database-password: smarthome-pass-2026
  secret-key: change-me-flask-session-key-2026
