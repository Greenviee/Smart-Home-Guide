  plan.html: |
    {% extends "base.html" %}
    {% block title %}추천받기 · {{ config.APP_TITLE }}{% endblock %}
    {% block content %}
    <h1 class="page-title">우리 집 정보 입력</h1>
    <form method="post" class="plan-form">
      <fieldset class="card">
        <legend>플랜 이름</legend>
        <input name="title" maxlength="50" placeholder="예: 부산 신혼집 24평" value="{{ title }}">
      </fieldset>

      <fieldset class="card">
        <legend>집 구조</legend>
        <p class="field-label">주거 형태</p>
        <div class="chips">
          {% for key, label in options.housing.items() %}
            <label class="chip"><input type="radio" name="housing" value="{{ key }}" {% if house.housing == key %}checked{% endif %}><span>{{ label }}</span></label>
          {% endfor %}
        </div>
        <div class="row">
          <label>평수<input type="number" name="area" min="5" max="200" value="{{ house.area }}"></label>
          <label>침실 개수<input type="number" name="rooms" min="1" max="8" value="{{ house.rooms }}"></label>
        </div>
        <p class="field-label">있는 공간 (복수 선택)</p>
        <div class="chips">
          {% for key, label in options.spaces.items() %}
            <label class="chip"><input type="checkbox" name="spaces" value="{{ key }}" {% if key in house.spaces %}checked{% endif %}><span>{{ label }}</span></label>
          {% endfor %}
        </div>
      </fieldset>

      <fieldset class="card">
        <legend>생활 조건</legend>
        <p class="field-label">가족 구성 (해당 시 선택)</p>
        <div class="chips">
          {% for key, label in options.household.items() %}
            <label class="chip"><input type="checkbox" name="household" value="{{ key }}" {% if key in house.household %}checked{% endif %}><span>{{ label }}</span></label>
          {% endfor %}
        </div>
        <p class="field-label">중요하게 생각하는 것</p>
        <div class="chips">
          {% for key, label in options.priorities.items() %}
            <label class="chip"><input type="checkbox" name="priorities" value="{{ key }}" {% if key in house.priorities %}checked{% endif %}><span>{{ label }}</span></label>
          {% endfor %}
        </div>
        <p class="field-label">예산</p>
        <div class="chips">
          {% for key, b in budgets.items() %}
            <label class="chip"><input type="radio" name="budget" value="{{ key }}" {% if house.budget == key %}checked{% endif %}><span>{{ b.label }}</span></label>
          {% endfor %}
        </div>
      </fieldset>

      <button class="btn btn-lg" type="submit">추천 결과 보기</button>
    </form>
    {% endblock %}
  result.html: |
    {% extends "base.html" %}
    {% block title %}{{ plan.title }} · {{ config.APP_TITLE }}{% endblock %}
    {% block content %}
    <div class="result-head">
      <div>
        <p class="eyebrow">{{ (plan.created_at|string)[:16] }} 저장됨</p>
        <h1 class="page-title">{{ plan.title }}</h1>
        <div class="tags">
          <span class="tag">{{ options.housing[house.housing] }}</span>
          <span class="tag">{{ house.area }}평</span>
          <span class="tag">침실 {{ house.rooms }}개</span>
          {% for s in house.spaces %}<span class="tag">{{ options.spaces[s] }}</span>{% endfor %}
          {% for h in house.household %}<span class="tag tag-accent">{{ options.household[h] }}</span>{% endfor %}
          {% for p in house.priorities %}<span class="tag tag-accent">{{ options.priorities[p] }}</span>{% endfor %}
        </div>
      </div>
      <div class="head-actions">
        <a class="btn" href="{{ url_for('plan') }}">새 플랜</a>
        <form method="post" action="{{ url_for('plan_delete', plan_id=plan.id) }}" onsubmit="return confirm('이 기록을 삭제할까요?')">
          <button class="btn btn-ghost" type="submit">삭제</button>
        </form>
      </div>
    </div>

    <section class="stats">
      <div class="stat"><span>추천 기기</span><strong>{{ result.count }}종</strong></div>
      <div class="stat"><span>예산 내 구매</span><strong>{{ result.in_budget_total|won }}</strong></div>
      <div class="stat"><span>전체 구성 비용</span><strong>{{ result.total|won }}</strong></div>
      <div class="stat"><span>예산</span><strong>{{ budgets[house.budget].label }}</strong></div>
    </section>

    {% for group in result.groups %}
    <section class="group">
      <h2>{{ group.label }}</h2>
      <div class="grid">
        {% for item in group["items"] %}
        <article class="product{% if not item.in_budget %} over{% endif %}">
          <img src="{{ url_for('static', filename=item.image) }}" alt="{{ item.name }}">
          <div class="product-body">
            <div class="product-top">
              <h3>{{ item.name }}</h3>
              {% if item.qty > 1 %}<span class="qty">× {{ item.qty }}</span>{% endif %}
            </div>
            <p class="desc">{{ item.desc }}</p>
            <div class="reasons">{% for r in item.reasons %}<span>{{ r }}</span>{% endfor %}</div>
            <div class="product-foot">
              <strong>{{ item.subtotal|won }}</strong>
              {% if item.in_budget %}<span class="badge ok">예산 내</span>{% else %}<span class="badge">추후 구매</span>{% endif %}
            </div>
          </div>
        </article>
        {% endfor %}
      </div>
    </section>
    {% endfor %}
    {% endblock %}
